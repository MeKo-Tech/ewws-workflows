name: write-registry-secrets

# Copies an app's SealedSecrets for one stage into the apps registry, so the
# vibe-tenants ApplicationSet applies them to the app's namespace:
#
#   <caller>/deploy/sealed/<stage>/<name>.yaml
#     -> <registry-repo>/secrets/<slug>/<stage>/<name>.yaml
#
# CI never seals and needs no Azure credentials. The files are sealed locally
# with `just secrets-seal` (kubeseal against the controller's public cert, scope
# strict) from the SOPS source `secrets/<stage>.sops.yaml`, which is encrypted
# with the vibe key (`sops-key-vibe` in `meko-vibe-vault`). Each SealedSecret
# carries the annotation `platform.meko.dev/sops-mac` with the `sops.mac` of the source it
# was sealed from. This workflow decrypts nothing: it reads `sops.mac` with yq and
# refuses to publish when a SealedSecret was not re-sealed after the SOPS file
# changed, or when a SealedSecret is not strictly scoped to
# `tenant-<slug>-<stage>`.
#
# Flow: consistency check of the caller's files → GitHub App token (scoped to
# the registry repository only) → checkout → replace `secrets/<slug>/<stage>/`
# with the caller's sealed directory (files gone there are deleted) → commit on
# a fresh branch → pull request → wait for the registry's required checks
# (`validate-apps`, `tag-scope`) → squash-merge with `--admin`. The App bypasses
# only the approval rule; the status checks are enforced by a ruleset without
# App bypass, so `--admin` fails until they pass. The merge is retried until
# `merge-timeout-minutes` runs out, then the job fails.
#
# The registry's `tag-scope` check limits a tagger pull request to
# `tags/<slug>/` and `secrets/<slug>/` of a single slug, and verifies the
# `Source-Repository:` line of the pull request body against the claim's
# `repo.url`, so an app can only publish secrets for its own slug.
#
# An unchanged directory is a successful no-op without a pull request.
#
# The caller's GITHUB_TOKEN is not used for anything beyond `contents: read`.

on:
  workflow_call:
    inputs:
      slug:
        description: "App slug; `apps/<slug>.yaml` must exist in the registry."
        type: string
        required: true
      stage:
        description: "`staging` or `prod`."
        type: string
        required: true
      sealed-dir:
        description: "Directory of the SealedSecrets in the calling repository. Empty means `deploy/sealed/<stage>`."
        type: string
        default: ""
      sops-file:
        description: "SOPS source the SealedSecrets were sealed from. Empty means `secrets/<stage>.sops.yaml`."
        type: string
        default: ""
      registry-repo:
        description: "Registry repository (`owner/name`)."
        type: string
        default: MeKo-Tech/ewws-apps-registry
      app-id:
        description: "ID of the GitHub App `ewws-registry-tagger`. Defaults to the org variable `EWWS_REGISTRY_TAGGER_APP_ID`."
        type: string
        default: ${{ vars.EWWS_REGISTRY_TAGGER_APP_ID }}
      merge-timeout-minutes:
        description: "How long to wait for the registry checks before failing."
        type: number
        default: 10
    secrets:
      registry-tagger-private-key:
        description: "Private key of the GitHub App. Optional with `secrets: inherit`, which passes the org secret `EWWS_REGISTRY_TAGGER_PRIVATE_KEY`."
        required: false
      EWWS_REGISTRY_TAGGER_PRIVATE_KEY:
        description: "Org secret, picked up through `secrets: inherit` when `registry-tagger-private-key` is not passed."
        required: false
    outputs:
      pr-url:
        description: "URL of the registry pull request; empty when nothing changed."
        value: ${{ jobs.write-secrets.outputs.pr-url }}
      merge-sha:
        description: "Squash-merge commit in the registry; empty when nothing changed."
        value: ${{ jobs.write-secrets.outputs.merge-sha }}

permissions:
  contents: read

jobs:
  write-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: registry-secrets-${{ inputs.slug }}-${{ inputs.stage }}
      cancel-in-progress: false
    outputs:
      pr-url: ${{ steps.publish.outputs.pr-url }}
      merge-sha: ${{ steps.publish.outputs.merge-sha }}
    steps:
      - name: Validate inputs
        id: validate
        env:
          SLUG: ${{ inputs.slug }}
          STAGE: ${{ inputs.stage }}
          SEALED_DIR: ${{ inputs.sealed-dir }}
          SOPS_FILE: ${{ inputs.sops-file }}
          REGISTRY_REPO: ${{ inputs.registry-repo }}
          APP_ID: ${{ inputs.app-id }}
          MERGE_TIMEOUT_MINUTES: ${{ inputs.merge-timeout-minutes }}
          PRIVATE_KEY: ${{ secrets.registry-tagger-private-key || secrets.EWWS_REGISTRY_TAGGER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          errors=0
          fail() { echo "::error::$*"; errors=$((errors + 1)); }

          # Same as the registry's app schema; the slug also becomes a path there.
          [[ "$SLUG" =~ ^[a-z][a-z0-9-]{2,30}[a-z0-9]$ ]] || fail "slug '$SLUG' is not a valid app slug"
          [[ "$STAGE" == staging || "$STAGE" == prod ]] || fail "stage must be 'staging' or 'prod', got '$STAGE'"
          sealed_dir=${SEALED_DIR:-deploy/sealed/${STAGE}}
          sealed_dir=${sealed_dir%/}
          sops_file=${SOPS_FILE:-secrets/${STAGE}.sops.yaml}
          # Both are paths inside the caller's checkout.
          for pair in "sealed-dir=$sealed_dir" "sops-file=$sops_file"; do
            name=${pair%%=*} value=${pair#*=}
            if [[ -z "$value" || "$value" == /* || "/${value}/" == */../* || ! "$value" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              fail "$name '$value' must be a relative path inside the repository ([A-Za-z0-9_./-], no '..')"
            fi
          done
          [[ "$REGISTRY_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "registry-repo must be 'owner/name', got '$REGISTRY_REPO'"
          [[ "$MERGE_TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]] || fail "merge-timeout-minutes must be a positive integer, got '$MERGE_TIMEOUT_MINUTES'"
          [[ -n "$APP_ID" ]] || fail "app-id is empty: set the org variable EWWS_REGISTRY_TAGGER_APP_ID or pass app-id"
          if [[ -z "$PRIVATE_KEY" ]]; then
            fail "no GitHub App private key: call this workflow with 'secrets: inherit' (org secret EWWS_REGISTRY_TAGGER_PRIVATE_KEY) or pass 'registry-tagger-private-key'"
          fi
          ((errors == 0)) || exit 1

          # The App token is scoped to exactly this one repository.
          {
            echo "registry-owner=${REGISTRY_REPO%%/*}"
            echo "registry-name=${REGISTRY_REPO#*/}"
            echo "sealed-dir=${sealed_dir}"
            echo "sops-file=${sops_file}"
          } >>"$GITHUB_OUTPUT"

      # actions/checkout@v7.0.1
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          persist-credentials: false

      # The app recipe's own check (go-react-template scripts/platform-secrets.sh,
      # yq only, no decryption). Optional: repos without the recipe rely on
      # the built-in check below, which always runs.
      - name: Run the recipe's check (platform-secrets.sh check)
        working-directory: source
        run: |
          set -euo pipefail
          if [[ -f scripts/platform-secrets.sh ]]; then
            bash scripts/platform-secrets.sh check
          else
            echo "scripts/platform-secrets.sh not present; built-in check only"
          fi

      # Reads metadata only; nothing here can or does decrypt.
      - name: Check SealedSecrets against the SOPS source
        working-directory: source
        env:
          SLUG: ${{ inputs.slug }}
          STAGE: ${{ inputs.stage }}
          SEALED_DIR: ${{ steps.validate.outputs.sealed-dir }}
          SOPS_FILE: ${{ steps.validate.outputs.sops-file }}
        run: |
          set -euo pipefail
          namespace="tenant-${SLUG}-${STAGE}"

          if [[ ! -f "$SOPS_FILE" ]]; then
            echo "::error::SOPS source ${SOPS_FILE} does not exist; the SealedSecrets in ${SEALED_DIR} must be sealed from it with 'just secrets-seal'"
            exit 1
          fi
          if ! mac=$(yq -r '.sops.mac // ""' "$SOPS_FILE") || [[ -z "$mac" ]]; then
            echo "::error file=${SOPS_FILE}::no sops.mac in ${SOPS_FILE}; is it a SOPS-encrypted YAML file?"
            exit 1
          fi
          if [[ ! -d "$SEALED_DIR" ]]; then
            echo "::error::sealed directory ${SEALED_DIR} does not exist; run 'just secrets-seal' and commit its output"
            exit 1
          fi

          errors=0
          fail() {
            local path=$1
            shift
            echo "::error file=${path}::$*"
            errors=$((errors + 1))
          }

          files=()
          while IFS= read -r -d '' path; do
            case "$path" in
            *.yaml) files+=("$path") ;;
            *) fail "$path" "only <name>.yaml SealedSecrets belong in ${SEALED_DIR}" ;;
            esac
          done < <(find "$SEALED_DIR" -mindepth 1 \( -type d -o -type f -o -type l \) -print0 | sort -z)
          if ((${#files[@]} == 0 && errors == 0)); then
            echo "::error::${SEALED_DIR} contains no SealedSecrets; run 'just secrets-seal' and commit its output"
            exit 1
          fi

          for path in "${files[@]}"; do
            if [[ -L "$path" || ! -f "$path" ]]; then
              fail "$path" "not a regular file"
              continue
            fi
            if ! docs=$(yq ea '[.] | length' "$path"); then
              fail "$path" "not valid YAML"
              continue
            fi
            if [[ "$docs" != 1 ]]; then
              fail "$path" "must hold exactly one YAML document, found ${docs}"
              continue
            fi
            base=${path##*/}
            base=${base%.yaml}
            kind=$(yq -r '.kind // ""' "$path")
            api=$(yq -r '.apiVersion // ""' "$path")
            name=$(yq -r '.metadata.name // ""' "$path")
            ns=$(yq -r '.metadata.namespace // ""' "$path")
            tname=$(yq -r '.spec.template.metadata.name // ""' "$path")
            tns=$(yq -r '.spec.template.metadata.namespace // ""' "$path")
            keys=$(yq -r '.spec.encryptedData // {} | length' "$path")
            scoped=$(yq -r '[(.metadata.annotations // {}), (.spec.template.metadata.annotations // {})]
              | map(keys) | flatten
              | map(select(. == "sealedsecrets.bitnami.com/cluster-wide" or . == "sealedsecrets.bitnami.com/namespace-wide"))
              | length' "$path")
            sealed_mac=$(yq -r '.metadata.annotations["platform.meko.dev/sops-mac"] // ""' "$path")

            [[ "$kind" == SealedSecret ]] || fail "$path" "kind must be SealedSecret, got '${kind}'"
            [[ "$api" == bitnami.com/v1alpha1 ]] || fail "$path" "apiVersion must be bitnami.com/v1alpha1, got '${api}'"
            [[ "$name" =~ ^[a-z][a-z0-9-]{1,40}[a-z0-9]$ ]] || fail "$path" "metadata.name '${name}' is not a valid secret name (^[a-z][a-z0-9-]{1,40}[a-z0-9]$)"
            [[ "$base" == "$name" ]] || fail "$path" "file name must be <metadata.name>.yaml, i.e. ${name}.yaml"
            [[ "$ns" == "$namespace" ]] || fail "$path" "metadata.namespace must be ${namespace}, got '${ns}'"
            [[ -z "$tname" || "$tname" == "$name" ]] || fail "$path" "spec.template.metadata.name '${tname}' differs from metadata.name '${name}'"
            [[ -z "$tns" || "$tns" == "$namespace" ]] || fail "$path" "spec.template.metadata.namespace must be ${namespace}, got '${tns}'"
            [[ "$keys" =~ ^[1-9][0-9]*$ ]] || fail "$path" "spec.encryptedData is empty"
            [[ "$scoped" == 0 ]] || fail "$path" "sealedsecrets.bitnami.com/cluster-wide and /namespace-wide are not allowed; seal with scope strict"
            if [[ -z "$sealed_mac" || "$sealed_mac" != "$mac" ]]; then
              fail "$path" "secrets geändert, aber nicht neu versiegelt – just secrets-seal laufen lassen"
            fi
          done
          ((errors == 0)) || exit 1
          echo "${#files[@]} SealedSecret(s) in ${SEALED_DIR} match ${SOPS_FILE}"

      # actions/create-github-app-token@v3.3.0
      - name: Create registry token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.registry-tagger-private-key || secrets.EWWS_REGISTRY_TAGGER_PRIVATE_KEY }}
          owner: ${{ steps.validate.outputs.registry-owner }}
          repositories: ${{ steps.validate.outputs.registry-name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      # actions/checkout@v7.0.1
      - name: Check out registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.registry-repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: registry

      - name: Write secrets, open and merge pull request
        id: publish
        working-directory: registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SLUG: ${{ inputs.slug }}
          STAGE: ${{ inputs.stage }}
          SEALED_SRC: ${{ github.workspace }}/source/${{ steps.validate.outputs.sealed-dir }}
          REGISTRY_REPO: ${{ inputs.registry-repo }}
          MERGE_TIMEOUT_MINUTES: ${{ inputs.merge-timeout-minutes }}
          POLL_SECONDS: "20"
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          BRANCH: secrets/${{ inputs.slug }}-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # Without this, a failing git/gh call inside `$(open_pr ...)` would not stop the function.
          shopt -s inherit_errexit

          dir="secrets/${SLUG}/${STAGE}"
          timeout_seconds=$((MERGE_TIMEOUT_MINUTES * 60))
          base=$(git rev-parse --abbrev-ref HEAD)

          # Commits are authored by the App's bot user.
          bot_login="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/${bot_login}" --jq .id)
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

          title="build(secrets): ${SLUG} ${STAGE}"

          # Replaces $dir with the caller's sealed directory, so files removed
          # there are removed here too. Returns 1 when nothing changed.
          write_secrets() {
            if [[ ! -f "apps/${SLUG}.yaml" ]]; then
              echo "::error::apps/${SLUG}.yaml does not exist in ${REGISTRY_REPO}; register the app before publishing its secrets"
              exit 1
            fi
            # write_secrets runs under `if`, which switches errexit off inside
            # it: every step that can fail aborts explicitly.
            if ! rm -rf -- "$dir" || ! mkdir -p -- "$dir" ||
              ! cp -- "$SEALED_SRC"/*.yaml "$dir"/; then
              echo "::error::cannot copy ${SEALED_SRC} to ${dir}"
              exit 1
            fi
            git add -A -- "$dir" || exit 1
            ! git diff --cached --quiet
          }

          open_pr() {
            local branch=$1
            git checkout -q -B "$branch"
            printf '%s\n\n%s\n%s\n' "$title" \
              "Source-Repository: ${SOURCE_REPOSITORY}" \
              "Source run: ${SOURCE}" >"$RUNNER_TEMP/commit-msg.txt"
            git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
            git push -q origin "HEAD:refs/heads/${branch}"
            printf '%s\n\n%s\n%s\n' \
              "Written by the \`write-registry-secrets\` workflow." \
              "Source-Repository: ${SOURCE_REPOSITORY}" \
              "Source run: ${SOURCE}" >"$RUNNER_TEMP/pr-body.md"
            gh pr create -R "$REGISTRY_REPO" --base "$base" --head "$branch" \
              --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          }

          # gh runs outside the checkout, so `--delete-branch` only deletes
          # the remote branch instead of also switching the local one.
          ghx() { (cd "$RUNNER_TEMP" && gh "$@"); }

          if ! write_secrets; then
            echo "${dir} already holds these SealedSecrets; nothing to do."
            exit 0
          fi
          branch=$BRANCH
          pr_url=$(open_pr "$branch")
          echo "Opened ${pr_url}"

          recreated=false
          deadline=$((SECONDS + timeout_seconds))
          while :; do
            info=$(ghx pr view "$pr_url" -R "$REGISTRY_REPO" \
              --json state,mergeable,mergeStateStatus --jq '"\(.state) \(.mergeable) \(.mergeStateStatus)"')
            read -r state mergeable merge_state <<<"$info"
            echo "PR state=${state} mergeable=${mergeable} mergeStateStatus=${merge_state}"

            if [[ "$state" == MERGED ]]; then
              break
            fi
            if [[ "$state" == CLOSED ]]; then
              echo "::error::${pr_url} was closed without being merged"
              exit 1
            fi

            if [[ "$mergeable" == CONFLICTING ]]; then
              if [[ "$recreated" == true ]]; then
                echo "::error::${pr_url} conflicts with ${base} again after re-creating it; giving up"
                exit 1
              fi
              # Someone else changed the same files. Start over from the latest base once.
              echo "::warning::${pr_url} conflicts with ${base}; re-creating it from the latest ${base}"
              ghx pr close "$pr_url" -R "$REGISTRY_REPO" --delete-branch \
                --comment "Conflicts with ${base}; the SealedSecrets are re-applied on top of the latest ${base}."
              recreated=true
              git fetch -q --depth=1 origin "$base"
              git checkout -q -B "$base" FETCH_HEAD
              if ! write_secrets; then
                echo "${base} already holds these SealedSecrets; nothing to do."
                pr_url=""
                break
              fi
              branch="${BRANCH}-retry"
              pr_url=$(open_pr "$branch")
              echo "Opened ${pr_url}"
              deadline=$((SECONDS + timeout_seconds))
              continue
            fi

            if [[ "$merge_state" == BEHIND ]]; then
              ghx api -X PUT "repos/${REGISTRY_REPO}/pulls/${pr_url##*/}/update-branch" --silent || true
            fi

            failed=$(ghx pr checks "$pr_url" -R "$REGISTRY_REPO" --required --json name,bucket \
              --jq '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")' 2>/dev/null || true)
            if [[ -n "$failed" ]]; then
              echo "::error::required checks failed on ${pr_url}: ${failed}"
              exit 1
            fi

            if ghx pr merge "$pr_url" -R "$REGISTRY_REPO" --squash --admin --delete-branch; then
              continue # confirm MERGED through the loop head
            fi

            if ((SECONDS >= deadline)); then
              echo "::error::${pr_url} could not be merged within ${MERGE_TIMEOUT_MINUTES} min; the registry checks are still pending or the App is not a bypass actor"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

          merge_sha=""
          if [[ -n "$pr_url" ]]; then
            merge_sha=$(ghx pr view "$pr_url" -R "$REGISTRY_REPO" --json mergeCommit --jq '.mergeCommit.oid')
            echo "Merged ${pr_url} as ${merge_sha}"
          fi
          {
            echo "pr-url=${pr_url}"
            echo "merge-sha=${merge_sha}"
          } >>"$GITHUB_OUTPUT"
