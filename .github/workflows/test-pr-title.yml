name: test-pr-title

# Validates that the PR title follows Conventional Commits. release-please
# keys off the title prefix to decide what kind of version bump (or no bump)
# the merge produces — a wrong title means no release ever cuts.
#
# Centralised here so every ewws-tagged repo enforces the same regex without
# copy-paste drift. Pin a tag for stability; pin @main for the rolling tip.

on:
  workflow_call:
    inputs:
      types:
        description: "Allowed type prefixes — newline-separated, one per line. Default mirrors the conventional-commit spec + release-please's recognised set."
        type: string
        default: |
          feat
          fix
          chore
          docs
          refactor
          perf
          test
          build
          ci
          style
          revert

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # amannn/action-semantic-pull-request@v6.1.1 — pin by SHA per repo policy.
      # `types:` MUST be newline-separated; a comma-separated string is
      # consumed as ONE literal type and rejects every real PR title.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          # Subject doesn't have to start uppercase — mirrors mekorp / ewws style.
          subjectPattern: ".+"
          # Multiple commits in one PR don't matter; we only check the merge-commit title.
          validateSingleCommit: false
