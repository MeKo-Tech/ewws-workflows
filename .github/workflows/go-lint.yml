name: go-lint

# golangci-lint v2 for Go modules. Mirrors the pinned config every
# ewws Go-repo uses today (golines + wsl_v5 + gci + staticcheck) — the
# rules themselves live in the consumer repo's `.golangci.yml`.

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version. Must match the consumer's go.mod (pin major.minor)."
        type: string
        default: "1.25.x"
      golangci-lint-version:
        description: "golangci-lint release tag (v2.x)."
        type: string
        default: "v2.4.0"
      working-directory:
        description: "Subdir of the repo to lint."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-go@v6.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      # golangci/golangci-lint-action@v8.0.0
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
