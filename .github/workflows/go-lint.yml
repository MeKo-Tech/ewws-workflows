name: go-lint

# golangci-lint v2 for Go modules. Mirrors the pinned config every
# ewws Go-repo uses today (golines + wsl_v5 + gci + staticcheck) — the
# rules themselves live in the consumer repo's `.golangci.yml`.

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go toolchain version. Must match the consumer's go.mod (pin major.minor)."
        type: string
        default: "1.27"
      golangci-lint-version:
        description: "golangci-lint release tag (v2.x)."
        type: string
        default: "v2.15.0"
      working-directory:
        description: "Subdir of the repo to lint."
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v7.0.1 — v4 runs on Node 20, which the runners now
      # force onto Node 24 and warn about on every run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go@v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum
      # golangci/golangci-lint-action@v9.3.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
