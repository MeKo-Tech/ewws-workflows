name: platform-check

# Guard rails for app repositories on the MeKo app platform. Fails when the
# repository carries something the platform forbids:
#
#   1. committed dotenv files (`.env`, `.env.local`, `prod.env`, …) — local
#      values belong in an untracked `.env`; only `*.example`, `*.sample`,
#      `*.template`, `*.dist` and SOPS-encrypted `*.sops.env` are allowed,
#   2. SOPS files in the binary format (`"data": "ENC[…]"`), which hide what
#      they contain from review and diff,
#   3. `*.sops.yaml` files not encrypted with exactly the vibe key
#      (`sops.azure_kv[]` all on https://meko-vibe-vault.vault.azure.net, key
#      `sops-key-vibe`; no `mekorp-vault*`, no pgp/age/kms/gcp_kms/hc_vault,
#      no unencrypted value), and files under `deploy/sealed/` that are not
#      bitnami.com/v1alpha1 SealedSecrets — read from metadata, nothing is
#      decrypted. Secret values live SOPS-encrypted in
#      `secrets/<stage>.sops.yaml` and are sealed locally with
#      `just secrets-seal` into `deploy/sealed/<stage>/`,
#   4. CI references to cluster or SOPS credentials (`EWWS_ON_PREM_KUBECONFIG`,
#      `AZURE_EWWS_KEY_VAULT_CLIENT_SECRET`, `AZURE_EWWS_KEY_VAULT_CREDS`)
#      under `.github/` — app CI builds and pushes images, the platform
#      deploys them,
#   5. plaintext secrets, found by gitleaks (pinned below). The working tree
#      is always scanned; on a pull request also every commit of the pull
#      request, so a secret added and removed again inside it still fails.
#      A `.gitleaks.toml` in the repository root is honoured. The files
#      checked in 3. are scanned too; only their ciphertext lines are ignored.
#
# Every check runs even when an earlier one failed, so one run lists all
# findings.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label for the job."
        type: string
        default: ubuntu-latest
      extra-forbidden-refs:
        description: "Additional names (one per line) that must not appear under `.github/`."
        type: string
        default: ""
      scan-history:
        description: "Let gitleaks scan the full Git history instead of the working tree and the pull request's commits."
        type: boolean
        default: false

permissions:
  contents: read

env:
  # gitleaks v8.30.1 — checksums from gitleaks_8.30.1_checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080

jobs:
  platform-check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1 — v4 runs on Node 20, which the runners now
      # force onto Node 24 and warn about on every run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The pull request's commit range and the full history need more
          # than the merge commit.
          fetch-depth: ${{ (inputs.scan-history || github.event_name == 'pull_request') && '0' || '1' }}
          persist-credentials: false

      - name: No committed dotenv files
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            case "$name" in
            *.example | *.sample | *.template | *.dist | *.sops.env) continue ;;
            .env | .env.* | *.env) ;;
            *) continue ;;
            esac
            echo "::error file=${path}::committed dotenv file — keep local values in an untracked .env, commit only .env.example; secret values belong SOPS-encrypted in secrets/<stage>.sops.yaml (vibe key sops-key-vibe in meko-vibe-vault), sealed with just secrets-seal into deploy/sealed/<stage>/"
            found=1
          done < <(git ls-files -z)
          if [[ "$found" -ne 0 ]]; then
            echo "Remove the files with 'git rm --cached <file>' and rotate every secret they contained." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "no dotenv files tracked"

      - name: No binary SOPS files
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          found=0
          # The binary format stores the whole file as one encrypted string
          # under a top-level "data" key next to the "sops" metadata block.
          # Parse every candidate as JSON so the layout (compact, pretty,
          # extra whitespace) does not matter.
          while IFS= read -r -d '' path; do
            if jq -e 'type == "object" and (.sops | type) == "object"
                and (.data | type) == "string" and (.data | startswith("ENC["))' \
              "$path" >/dev/null 2>&1; then
              echo "::error file=${path}::SOPS file in binary format — keep secret values SOPS-encrypted as YAML in secrets/<stage>.sops.yaml (vibe key sops-key-vibe in meko-vibe-vault) and seal them with just secrets-seal into deploy/sealed/<stage>/"
              found=1
            fi
          done < <(git grep -z -l -F 'ENC[AES256_GCM,' || true)
          [[ "$found" -eq 0 ]] || exit 1
          echo "no binary SOPS files"

      # Reads SOPS metadata and SealedSecret headers only; nothing is decrypted.
      # The gitleaks step below ignores only ciphertext lines of these files.
      - name: SOPS files use the vibe key, sealed files are SealedSecrets
        if: ${{ !cancelled() }}
        env:
          VIBE_VAULT: https://meko-vibe-vault.vault.azure.net
          VIBE_KEY: sops-key-vibe
        run: |
          set -euo pipefail
          if ! command -v yq >/dev/null; then
            echo "::error::yq (mikefarah/yq v4) is not installed on this runner"
            exit 1
          fi
          found=0
          err() {
            echo "::error file=$1::$2"
            found=1
          }
          rule="vibe apps may only use meko-vibe-vault/${VIBE_KEY} (${VIBE_VAULT}), never mekorp-vault*"

          sops_files=0
          while IFS= read -r -d '' path; do
            sops_files=$((sops_files + 1))
            if ! tag=$(yq -r '.sops | tag' "$path" 2>/dev/null); then
              err "$path" "${path}: not valid YAML"
              continue
            fi
            if [[ "$tag" != '!!map' ]]; then
              err "$path" "${path}: no sops metadata — a *.sops.yaml file must be SOPS-encrypted (${rule})"
              continue
            fi
            if [[ "$(yq -r '.sops.azure_kv // [] | length' "$path")" == 0 ]]; then
              err "$path" "${path}: no sops.azure_kv entry — ${rule}"
            fi
            while IFS=' ' read -r url key; do
              url=${url%/}
              if [[ "$url" == *mekorp-vault* ]]; then
                err "$path" "${path}: encrypted with ${url} — ${rule}"
              elif [[ "$url" != "$VIBE_VAULT" || "$key" != "$VIBE_KEY" ]]; then
                err "$path" "${path}: encrypted with ${url:-<no vault_url>} key ${key:-<no name>} — ${rule}"
              fi
            done < <(yq -r '.sops.azure_kv // [] | .[] | (.vault_url // "") + " " + (.name // "")' "$path")
            others=$(yq -r '.sops | to_entries
              | map(select((.key == "pgp" or .key == "age" or .key == "kms" or .key == "gcp_kms" or .key == "hc_vault")
                and (.value | length) > 0))
              | map(.key) | join(", ")' "$path")
            if [[ -n "$others" ]]; then
              err "$path" "${path}: also encrypted with ${others} — ${rule}"
            fi
            # Key paths only, never values.
            plain=$(yq -r '[del(.sops) | .. | select(tag != "!!map" and tag != "!!seq")
              | select(tag != "!!str" or (test("^ENC\[AES256_GCM,") | not))
              | path | join(".")] | join(", ")' "$path")
            if [[ -n "$plain" ]]; then
              err "$path" "${path}: unencrypted values at ${plain} — encrypt the whole file with sops"
            fi
          done < <(git ls-files -z -- '*.sops.yaml')

          sealed_files=0
          while IFS= read -r -d '' path; do
            sealed_files=$((sealed_files + 1))
            if ! docs=$(yq ea '[.] | length' "$path" 2>/dev/null); then
              err "$path" "${path}: not valid YAML"
              continue
            fi
            if [[ "$docs" != 1 ]]; then
              err "$path" "${path}: deploy/sealed/ holds one SealedSecret per file, found ${docs} documents"
              continue
            fi
            kind=$(yq -r '.kind // ""' "$path")
            api=$(yq -r '.apiVersion // ""' "$path")
            if [[ "$kind" != SealedSecret || "$api" != bitnami.com/v1alpha1 ]]; then
              err "$path" "${path}: deploy/sealed/ holds only bitnami.com/v1alpha1 SealedSecrets, got ${api:-?}/${kind:-?} — seal with just secrets-seal"
            fi
            # spec.template.data is copied into the Secret unencrypted.
            if [[ "$(yq -r '.spec.template.data // {} | length' "$path")" != 0 ]]; then
              err "$path" "${path}: spec.template.data is not encrypted — put every value into secrets/<stage>.sops.yaml and seal it"
            fi
          done < <(git ls-files -z -- 'deploy/sealed/*.yaml')

          [[ "$found" -eq 0 ]] || exit 1
          echo "${sops_files} SOPS file(s) on ${VIBE_VAULT}/${VIBE_KEY}, ${sealed_files} SealedSecret(s)"

      - name: No cluster or SOPS credentials in CI
        if: ${{ !cancelled() }}
        env:
          EXTRA: ${{ inputs.extra-forbidden-refs }}
        run: |
          set -euo pipefail
          names=(EWWS_ON_PREM_KUBECONFIG AZURE_EWWS_KEY_VAULT_CLIENT_SECRET AZURE_EWWS_KEY_VAULT_CREDS)
          while IFS= read -r extra; do
            extra="${extra//[[:space:]]/}"
            [[ -n "$extra" ]] && names+=("$extra")
          done <<<"$EXTRA"
          if [[ ! -d .github ]]; then
            echo "no .github directory"
            exit 0
          fi
          args=()
          for n in "${names[@]}"; do args+=(-e "$n"); done
          found=0
          while IFS= read -r hit; do
            [[ -n "$hit" ]] || continue
            file="${hit%%:*}"
            rest="${hit#*:}"
            line="${rest%%:*}"
            text="${rest#*:}"
            text="${text#"${text%%[![:space:]]*}"}"
            text="${text%"${text##*[![:space:]]}"}"
            text="${text#extra-forbidden-refs:}"
            text="${text#"${text%%[![:space:]]*}"}"
            # A line that is nothing but a name is this check's own
            # `extra-forbidden-refs` list in the caller, not a usage.
            skip=0
            for n in "${names[@]}"; do [[ "$text" == "$n" ]] && skip=1; done
            [[ "$skip" -eq 1 ]] && continue
            echo "::error file=${file},line=${line}::app CI must not use cluster or SOPS credentials — build and push the image, the platform deploys it"
            found=1
          done < <(git grep -n -F -w "${args[@]}" -- .github || true)
          [[ "$found" -eq 0 ]] || exit 1
          echo "no forbidden credentials referenced: ${names[*]}"

      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
          x86_64) arch=x64 sum="$GITLEAKS_SHA256_X64" ;;
          aarch64 | arm64) arch=arm64 sum="$GITLEAKS_SHA256_ARM64" ;;
          *) echo "::error::unsupported architecture $(uname -m)" && exit 1 ;;
          esac
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${sum}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" gitleaks
          echo "$dir" >>"$GITHUB_PATH"
          "$dir/gitleaks" version

      - name: No plaintext secrets (gitleaks)
        if: ${{ !cancelled() }}
        env:
          SCAN_HISTORY: ${{ inputs.scan-history }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Ciphertext in SOPS files and SealedSecrets looks like secrets to
          # gitleaks. Allow only ciphertext-shaped lines (ENC[AES256_GCM,...], sops
          # enc:, SealedSecret Ag... values) - comments, annotations and history in
          # those files are still scanned. An own
          # .gitleaks.toml stays in force through `extend`.
          cfg="$RUNNER_TEMP/gitleaks.toml"
          if [[ -f .gitleaks.toml ]]; then
            printf '[extend]\npath = "%s"\n\n' "$PWD/.gitleaks.toml" >"$cfg"
          else
            printf '[extend]\nuseDefault = true\n\n' >"$cfg"
          fi
          cat >>"$cfg" <<'EOF'
          [[allowlists]]
          description = "SOPS and SealedSecret ciphertext lines only (checked by platform-check)"
          regexTarget = "line"
          regexes = [
            '''^\s*[^\s:#][^:#]*:\s+ENC\[AES256_GCM,data:[A-Za-z0-9+/=]*,iv:[A-Za-z0-9+/=]+,tag:[A-Za-z0-9+/=]+,type:[a-z]+\]\s*$''',
            '''^\s*enc:\s+[A-Za-z0-9+/=_-]+\s*$''',
            '''^\s+[A-Za-z_][A-Za-z0-9_.-]*:\s+Ag[A-Za-z0-9+/=]{100,}\s*$''',
          ]
          EOF
          rc=0
          if [[ "$SCAN_HISTORY" == "true" ]]; then
            gitleaks git . --config "$cfg" --no-banner --redact --exit-code 1 || rc=1
          else
            gitleaks dir . --config "$cfg" --no-banner --redact --exit-code 1 || rc=1
            if [[ "$EVENT" == "pull_request" && -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
              gitleaks git . --config "$cfg" --no-banner --redact --exit-code 1 \
                --log-opts="${BASE_SHA}..${HEAD_SHA}" || rc=1
            fi
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::gitleaks found plaintext secrets — remove them, rotate them, and keep them SOPS-encrypted in secrets/<stage>.sops.yaml (vibe key sops-key-vibe in meko-vibe-vault), sealed with just secrets-seal into deploy/sealed/<stage>/"
          fi
          exit "$rc"
