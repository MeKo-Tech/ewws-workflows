name: build-and-push

# Multi-arch (amd64 + arm64) Docker build, pushed to ghcr.io. Tags follow
# the metadata-action convention so the cluster image-updater + the
# platform-UI drift detector can both parse them:
#
#   type=ref,event=branch      → e.g. "main" or "deploy/foo"
#   type=ref,event=pr          → "pr-123"
#   type=semver,pattern={...}  → "1.2.3" + "1.2" + "1"
#   type=sha,prefix=sha-       → "sha-c69034c" (git short SHA)
#
# The `sha-*` tag is the one platform-UI's drift detector strips the
# prefix from to feed into the GitHub compare API.

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full OCI image name without tag. Conventional value: `ghcr.io/meko-tech/<repo>`."
        type: string
        required: true
      dockerfile:
        description: "Path to the Dockerfile relative to repo root."
        type: string
        default: ./Dockerfile
      context:
        description: "Build context dir."
        type: string
        default: .
      platforms:
        description: "Comma-separated platforms for buildx. Default amd64 + arm64."
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: "Whether to push the image (skip for PR previews)."
        type: boolean
        default: true
    secrets:
      gh-pat:
        description: "Optional GitHub token, passed to BuildKit as secret `gh_pat` (mount it with `RUN --mount=type=secret,id=gh_pat`) to fetch private modules such as ewws-auth. Never written to a layer."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # All action SHAs below are copied from a known-working workflow so
      # we avoid the "unable to resolve action" trap from a typo'd SHA.
      # actions/checkout@v7.0.1 — v4 runs on Node 20, which the runners now
      # force onto Node 24 and warn about on every run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      # docker/setup-buildx-action@v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # docker/login-action@v4.6.0 — `secrets: inherit` from caller gives us GITHUB_TOKEN.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/metadata-action@v6.2.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
      # docker/build-push-action@v7.4.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Empty when the caller passes no `gh-pat`; a Dockerfile that
          # mounts the secret then reads an empty file.
          secrets: |
            gh_pat=${{ secrets.gh-pat }}
