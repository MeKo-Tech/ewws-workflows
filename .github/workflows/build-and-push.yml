name: build-and-push

# Docker build (amd64 + arm64 by default), pushed to ghcr.io. Runs on a
# GitHub-hosted runner unless `runner` names one of our own pools; the README
# says which. Tags follow
# the metadata-action convention so the cluster image-updater + the
# platform-UI drift detector can both parse them:
#
#   type=ref,event=branch      → e.g. "main" or "deploy/foo"
#   type=ref,event=pr          → "pr-123"
#   type=semver,pattern={...}  → "1.2.3" + "1.2" + "1"
#   type=sha,prefix=sha-       → "sha-c69034c" (git short SHA)
#   type=raw,value=<extra-tag> → one per line of `extra-tags`, e.g. "1.5.0-6c98a25"
#
# The `sha-*` tag is the one platform-UI's drift detector strips the
# prefix from to feed into the GitHub compare API. `latest` is never pushed
# (flavor latest=false, and `extra-tags` refuses it): which build a stage
# runs is written down by tag, not by a moving pointer.
#
# The workflow lower-cases `image-name` in its first step and uses only that
# name afterwards (ownership check, tags, cache ref, push), because ghcr.io
# refuses capitals and `github.event.repository.name` keeps them.

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full OCI image name without tag. An image belongs to exactly one repository, and only that repository's CI pushes it: `ghcr.io/meko-tech/<repo>/<component>`, or `ghcr.io/meko-tech/<repo>` for a repository with a single image. `<repo>` is the caller's current GitHub repository name, underscores kept. The workflow writes the whole name in lower case before it uses it, so the repository name as `github.event.repository.name` gives it also works for a repository with capitals. See `image-ownership-mode`."
        type: string
        required: true
      image-ownership-mode:
        description: "What happens when `image-name` is not `ghcr.io/meko-tech/<repo>` or below it: `warn` (annotation, the build goes on) or `error` (the job fails)."
        type: string
        default: warn
      dockerfile:
        description: "Path to the Dockerfile relative to repo root."
        type: string
        default: ./Dockerfile
      context:
        description: "Build context dir."
        type: string
        default: .
      platforms:
        description: "Comma-separated platforms for buildx. Default amd64 + arm64."
        type: string
        default: linux/amd64,linux/arm64
      push:
        description: "Whether to push the image (skip for PR previews)."
        type: boolean
        default: true
      runner:
        description: "runs-on label of the build job. One of our own pools with Docker (`ewws-arc-ci-onprem`) builds there instead of on a GitHub-hosted runner; that needs `platforms: linux/amd64` and should go with `cache: registry`."
        type: string
        default: ubuntu-latest
      cache:
        description: "BuildKit layer cache: `gha` (Actions cache), `registry` (`<image-name>:buildcache` on ghcr.io, written on every event but pull_request) or `none`."
        type: string
        default: gha
      submodules:
        description: "Passed to actions/checkout as `submodules`: `false`, `true` or `recursive`."
        type: string
        default: "false"
      timeout-minutes:
        description: "Job timeout. The default is GitHub's own; on our pools a hung build squats a runner slot for that long, so pass a real one."
        type: number
        default: 360
      build-args:
        description: "Build arguments, one `KEY=VALUE` per line, passed to docker/build-push-action unchanged (e.g. `VERSION=1.5.0`)."
        type: string
        default: ""
      extra-tags:
        description: "Additional tags, one raw tag value per line (e.g. `1.5.0-6c98a25`), each added as `type=raw,value=<tag>`. Blank lines are ignored. A value must match `[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}`; `latest` is refused."
        type: string
        default: ""
    secrets:
      gh-pat:
        description: "Optional GitHub token, passed to BuildKit as secret `gh_pat` (mount it with `RUN --mount=type=secret,id=gh_pat`) to fetch private modules such as ewws-auth. Not mounted at all when omitted. The Dockerfile must not write the token to a file (e.g. `git config --global`); see README."
        required: false
    outputs:
      sha-tag:
        description: "The `sha-<7>` tag that was pushed (e.g. `sha-c69034c`); empty when nothing was pushed."
        value: ${{ jobs.build.outputs.sha-tag }}
      image:
        description: "The image name as built and pushed: `image-name` in lower case."
        value: ${{ jobs.build.outputs.image }}
      tags:
        description: "Every tag metadata-action computed, one `<image>:<tag>` per line. Also set when nothing was pushed (`push: false`, pull requests); use `sha-tag` to tell."
        value: ${{ jobs.build.outputs.tags }}
      version:
        description: "metadata-action's `version`, its highest-priority tag: `1.2.3` on a semver tag push, the branch name on a branch push, `pr-123` on a pull request. An `extra-tags` value ranks below these."
        value: ${{ jobs.build.outputs.version }}
      digest:
        description: "Image digest (`sha256:…`) reported by docker/build-push-action."
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      sha-tag: ${{ steps.sha-tag.outputs.sha-tag }}
      image: ${{ steps.image.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # ghcr.io takes lower-case names only, and `github.event.repository.name`
      # keeps the repository's capitals. Everything below uses this output,
      # never `inputs.image-name`. Whitespace is refused because the value is
      # written to $GITHUB_OUTPUT, where a newline would start another output.
      - name: Normalize image name
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          if [[ -z $IMAGE_NAME || $IMAGE_NAME =~ [[:space:]] ]]; then
            echo "::error::image-name must be non-empty and contain no whitespace, got '${IMAGE_NAME}'"
            exit 1
          fi
          echo "image=${IMAGE_NAME,,}" >>"$GITHUB_OUTPUT"
      # An image belongs to exactly one repository, and only that repository's
      # CI pushes it. In a reusable workflow `github.repository` is the caller,
      # so the owned prefix is ghcr.io/meko-tech/<caller repo, lower case>,
      # followed by the end of the name or a "/".
      - name: Check image ownership
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image }}
          MODE: ${{ inputs.image-ownership-mode }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$MODE" in
          warn | error) ;;
          *)
            echo "::error::image-ownership-mode must be 'warn' or 'error', got '${MODE}'"
            exit 1
            ;;
          esac
          repo="${CALLER_REPO#*/}"
          owned="ghcr.io/meko-tech/${repo,,}"
          if [[ $IMAGE_NAME == "$owned" || $IMAGE_NAME == "$owned/"* ]]; then
            exit 0
          fi
          msg="image-name '${IMAGE_NAME}' is not owned by ${CALLER_REPO}: an image belongs to exactly one repository, and only that repository's CI pushes it. Use '${owned}' or '${owned}/<component>'."
          if [ "$MODE" = "error" ]; then
            echo "::error title=image ownership::${msg}"
            exit 1
          fi
          echo "::warning title=image ownership::${msg}"
      # Before the checkout, so a wrong call costs seconds. Our pools are amd64
      # only, and setup-qemu-action registers its emulators with the kernel
      # (binfmt_misc) of the node, which every other pod on it shares — so a
      # foreign platform is refused there rather than emulated.
      - name: Check inputs
        env:
          CACHE: ${{ inputs.cache }}
          PLATFORMS: ${{ inputs.platforms }}
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          case "$CACHE" in
          gha | registry | none) ;;
          *)
            echo "::error::cache must be 'gha', 'registry' or 'none', got '${CACHE}'"
            exit 1
            ;;
          esac
          if [ "$RUNNER_KIND" = "self-hosted" ] && [ "$PLATFORMS" != "linux/amd64" ]; then
            echo "::error::platforms is '${PLATFORMS}', but a build on our own runners must be 'linux/amd64'"
            exit 1
          fi
      # The metadata-action tag list: the fixed rules plus one `type=raw` per
      # line of `extra-tags`. Each value is checked against Docker's tag
      # grammar before it goes into the list, so a value can neither add a
      # rule of its own (`,` `=` `{` are not allowed) nor end the multi-line
      # output early: the delimiter contains a space, which no line can.
      - name: Build the tag list
        id: tags
        env:
          EXTRA_TAGS: ${{ inputs.extra-tags }}
        run: |
          set -euo pipefail
          delim="END OF TAGS"
          failed=0
          raw=()
          while IFS= read -r line || [[ -n $line ]]; do
            # trim surrounding whitespace (also a CR from a CRLF block)
            tag="${line#"${line%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            [[ -z $tag ]] && continue
            if [[ ${tag,,} == latest ]]; then
              echo "::error::extra-tags: '${tag}' is refused; this workflow never pushes latest"
              failed=1
            elif [[ ! $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::extra-tags: '${tag}' is not a valid Docker tag ([A-Za-z0-9_][A-Za-z0-9_.-]{0,127})"
              failed=1
            else
              raw+=("type=raw,value=${tag}")
            fi
          done <<<"$EXTRA_TAGS"
          if [[ $failed -ne 0 ]]; then
            exit 1
          fi
          {
            echo "tags<<${delim}"
            echo "type=ref,event=branch"
            echo "type=ref,event=pr"
            echo "type=semver,pattern={{version}}"
            echo "type=semver,pattern={{major}}.{{minor}}"
            echo "type=semver,pattern={{major}}"
            echo "type=sha,prefix=sha-"
            if [[ ${#raw[@]} -gt 0 ]]; then
              printf '%s\n' "${raw[@]}"
            fi
            echo "${delim}"
          } >>"$GITHUB_OUTPUT"
      # All action SHAs below are copied from a known-working workflow so
      # we avoid the "unable to resolve action" trap from a typo'd SHA.
      # actions/checkout@v7.0.1 — v4 runs on Node 20, which the runners now
      # force onto Node 24 and warn about on every run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: ${{ inputs.submodules }}
      # docker/setup-qemu-action@v4.4.0 — only when something other than the
      # runner's own architecture is built.
      - if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      # docker/setup-buildx-action@v4.4.1
      - if: runner.environment != 'self-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      # Our own pools (ewws-github-runner chart): the runner container carries
      # BUILDKITD_CONFIG and BUILDKIT_IMAGE, but `${{ env.* }}` reads the Actions
      # env context, which holds only what a workflow, job or step put there. So
      # both are promoted into it here. Failing loudly is deliberate: an unset
      # variable means the pool predates the chart that sets it (or is not one of
      # ours), and building against Docker Hub on a floating BuildKit tag is the
      # failure these settings exist to remove.
      - name: Resolve the runner's BuildKit settings
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if [ -z "${BUILDKITD_CONFIG:-}" ] || [ ! -r "${BUILDKITD_CONFIG}" ]; then
            echo "::error::BUILDKITD_CONFIG is unset or not readable ('${BUILDKITD_CONFIG:-}'): this runner is not an ewws-arc-ci pool with Docker, or predates ewws-github-runner 0.21.0"
            exit 1
          fi
          if [ -z "${BUILDKIT_IMAGE:-}" ]; then
            echo "::error::BUILDKIT_IMAGE is unset: this runner predates the chart that pins BuildKit (MeKo-Tech/ewws-github-runner#176)"
            exit 1
          fi
          {
            echo "BUILDKITD_CONFIG=${BUILDKITD_CONFIG}"
            echo "BUILDKIT_IMAGE=${BUILDKIT_IMAGE}"
          } >>"$GITHUB_ENV"
      # docker/setup-buildx-action@v4.4.1 — same settings as build-push.yaml in
      # mekorp-backend, which explains each at length:
      #   buildkitd-config  the in-cluster registry mirror. The action boots its
      #                     own BuildKit container, which reads neither dind's
      #                     buildkitd.toml nor the daemon's registry-mirrors, so
      #                     without it every base image comes from Docker Hub.
      #   network=host      lets that container reach the mirror.
      #   image=            the BuildKit version the runner chart pins and
      #                     prewarms, instead of the floating buildx-stable-1.
      #   cgroup-parent     keeps the builder inside the runner pod's limits.
      - name: Set up Docker Buildx on our own runner
        if: runner.environment == 'self-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: |
            network=host
            image=${{ env.BUILDKIT_IMAGE }}
            cgroup-parent=inner
          buildkitd-config: ${{ env.BUILDKITD_CONFIG }}
      # docker/login-action@v4.6.0 — GITHUB_TOKEN is always available to a
      # called workflow, with the permissions the caller grants (packages:
      # write); it needs no `secrets: inherit`.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/metadata-action@v6.2.0 — latest=false: the default `auto` adds `latest`
      # on a semver tag push (the semver rules above).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: |
            latest=false
          tags: ${{ steps.tags.outputs.tags }}
      # docker/build-push-action@v7.4.0
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          # `registry` keeps the cache next to the image as `:buildcache` (zstd,
          # as mekorp-backend and ccbatch do). A pull request reads it but does
          # not write it: its layers would replace the default branch's.
          cache-from: ${{ inputs.cache == 'gha' && 'type=gha' || inputs.cache == 'registry' && format('type=registry,ref={0}:buildcache', steps.image.outputs.image) || '' }}
          cache-to: ${{ inputs.cache == 'gha' && 'type=gha,mode=max' || inputs.cache == 'registry' && github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true', steps.image.outputs.image) || '' }}
          # Only when the caller passes `gh-pat`: an empty `gh_pat=` makes the
          # action warn and skip the secret anyway, so /run/secrets/gh_pat is
          # then absent rather than empty.
          secrets: ${{ secrets.gh-pat != '' && format('gh_pat={0}', secrets.gh-pat) || '' }}
      # Taken from the metadata-action tag list, so it is exactly the tag that
      # was pushed — not a re-derivation of the short SHA. The list is sorted by
      # priority and `type=sha` has the lowest, so the LAST match is the commit
      # tag; a branch named `sha-…` would come first.
      - id: sha-tag
        if: inputs.push && github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag=$(printf '%s\n' "$TAGS" | sed -n 's/^.*:\(sha-[0-9a-f]*\)$/\1/p' | tail -n 1)
          if [[ -z "$tag" ]]; then
            echo "::error::no sha-* tag among the pushed tags"
            exit 1
          fi
          echo "sha-tag=${tag}" >>"$GITHUB_OUTPUT"
