name: release-please

# Cuts release PRs + tags from Conventional Commits. Default `release-type:
# simple` reads version from `version.txt`. The `released` and `tag-name`
# outputs let downstream jobs (build-and-push, sbom-upload, etc.) gate on
# whether this run actually produced a release.

on:
  workflow_call:
    inputs:
      release-type:
        description: "release-please release-type. `simple` for repos with a `version.txt`; `go` for Go modules; `node`, etc. Not passed to the action when `config-file` is set: the config file's `release-type` applies."
        type: string
        default: simple
      package-name:
        description: "Used in the release-please-action `package-name` field. Defaults to the repo name."
        type: string
        default: ""
      config-file:
        description: "Path to release-please-config.json. Set this for manifest-based (e.g. multi-package) setups; when set, `release-type` is not passed to the action and the config file decides."
        type: string
        default: ""
      manifest-file:
        description: "Path to .release-please-manifest.json. Required when `config-file` is set."
        type: string
        default: ""
    outputs:
      released:
        description: "true when this run cut a new tag"
        value: ${{ jobs.release.outputs.released }}
      tag-name:
        description: "The cut tag (e.g. `v1.2.3`). Empty when `released=false`."
        value: ${{ jobs.release.outputs.tag-name }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag-name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # googleapis/release-please-action@v5.0.0 — pin by SHA per repo policy.
      #
      # The action accepts EITHER release-type (simple repos with one
      # package) OR config-file/manifest-file (manifest layout). A non-empty
      # release-type makes the action skip config-file/manifest-file entirely
      # (src/index.ts, loadOrBuildManifest: `if (inputs.releaseType)` →
      # Manifest.fromConfig). So release-type is only passed when no
      # config-file is set; otherwise the `simple` default would override
      # the caller's config.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          release-type: ${{ inputs.config-file == '' && inputs.release-type || '' }}
          package-name: ${{ inputs.package-name || github.event.repository.name }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          token: ${{ secrets.GITHUB_TOKEN }}
